<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Working Tools Box - Free Online Tools</title>
  <meta name="description" content="Working Tools Box provides fast, free online tools for images, PDFs, text, developers, SEO and everyday tasks.">
  <link rel="canonical" href="https://workingtoolsbox.vercel.app/">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">WORKING TOOLS BOX</p>
      <h1>Free Online Tools for Everyday Work</h1>
      <p class="hero-text">Fast, simple browser-based tools for files, images, text, developers and more.</p>
      <a class="button" href="#tools">Explore Tools</a>

    <section id="tools" class="section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">TOOLS</p>
          <h2>Tool Collection</h2>

        <span class="tool-count">0 tools</span>
      </div>

        <h3>Tools are being prepared</h3>
        <p>The first batch of fully functional tools will be added here.</p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/main.js" defer></script>

</html>
